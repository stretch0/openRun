services:
  openrun:
    image: ghcr.io/stretch0/openrun:latest
    # To build from source instead: replace `image` with `build: .`
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env
    environment:
      # PORT in .env picks the port on this machine; inside the container
      # openRun always listens on 3000.
      PORT: 3000
    volumes:
      - ./data:/data
