name: Image scan

# Scans the Docker image for known vulnerabilities (mostly in the base image's
# OS packages, which npm audits never see) and the Dockerfile and compose file
# for risky settings. Not a required check: base image fixes often lag, so a
# finding may have nothing to upgrade to yet.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - docker-entrypoint.sh
      - package-lock.json
      - .github/workflows/image-scan.yml
  schedule:
    # Weekly, to catch vulnerabilities found since the last change.
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Scan image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # Pull requests from forks can't upload results; they still get the table.
    env:
      UPLOAD: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t openrun:scan .

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openrun:scan
          format: sarif
          output: image.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
      - name: Scan the Dockerfile and compose file
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: config.sarif
          skip-setup-trivy: true
      - if: env.UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: image.sarif
          category: trivy-image
      - if: env.UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: config.sarif
          category: trivy-config

      # Turns the job red for high and critical findings that have a fix.
      - name: Fail on fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openrun:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
