# Weekly update pull requests for npm packages, GitHub Actions and the Docker
# base images. Security fixes come straight away, separately (turned on in the
# repository settings). New releases wait a week, so a compromised release
# has time to be caught before it's proposed here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # One pull request for all minor and patch updates; majors on their own.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
