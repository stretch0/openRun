# openRun on Fly.io, with your data on a volume. See docs/FLY.md.
#
# Change `app`, `ORIGIN` and `primary_region` before deploying.

app = 'my-openrun'
primary_region = 'lhr'

[build]
  # A release line: deploys pick up its fixes, not the next minor release,
  # since database updates can't be undone. Bump it when you choose to upgrade.
  image = 'ghcr.io/stretch0/openrun:0.3'

[env]
  # The address people use. Passkeys are tied to its hostname, so settle on
  # it before anyone adds one.
  ORIGIN = 'https://my-openrun.fly.dev'
  # Fly's proxy sets X-Forwarded-For, so the sign-in rate limit may trust it.
  TRUST_PROXY = 'true'
  # It's on the internet: people sign up with invites you make in the app.
  # The first account doesn't need one and becomes the admin.
  INVITE_ONLY = 'true'
  INSTANCE_NAME = 'openRun'
  # How members can reach you, shown in the app.
  # INSTANCE_CONTACT = 'you@example.com'

# Accounts, runs, original files, club logos and push keys. Without a volume
# they'd be lost on every restart.
[mounts]
  source = 'openrun_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  # Always on, or syncs, weather updates and run reminders don't happen.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
